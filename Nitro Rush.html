x2.beginPath();x2.moveTo(-w*.29,-h*.67);x2.lineTo(-w*.22,-h*.91);x2.lineTo(w*.22,-h*.91);x2.lineTo(w*.29,-h*.67);x2.closePath();x2.fillStyle=L(-h*.91,-h*.67,'#2b3f86','#05060f');x2.fill();
x2.fillStyle='rgba(255,255,255,.18)';x2.beginPath();x2.moveTo(-w*.2,-h*.69);x2.lineTo(-w*.12,-h*.9);x2.lineTo(-w*.04,-h*.9);x2.lineTo(-w*.12,-h*.69);x2.fill();
x2.fillStyle='#0a0a10';x2.fillRect(-w*.36,-h*.84,w*.03,h*.2);x2.fillRect(w*.33,-h*.84,w*.03,h*.2);
const sq=o.spo===undefined?2:o.spo;if(sq===1){x2.fillStyle=d;x2.fillRect(-w*.42,-h*.68,w*.84,h*.04)}else if(sq>1){const ww=sq===3?.54:.5,yy=sq===3?1.02:.93;x2.fillStyle='#0a0a10';x2.fillRect(-w*.2,-h*.8,w*.03,h*.2);x2.fillRect(w*.17,-h*.8,w*.03,h*.2);x2.fillStyle=d;x2.fillRect(-w*ww,-h*yy,w*ww*2,h*.07);x2.fillStyle='rgba(255,255,255,.4)';x2.fillRect(-w*ww,-h*yy,w*ww*2,h*.02);x2.fillStyle=d;x2.fillRect(-w*ww,-h*yy,w*.04,h*.32);x2.fillRect(w*(ww-.04),-h*yy,w*.04,h*.32)}
const b=o.brake?1:.8;x2.fillStyle=`rgba(255,16,48,${b})`;x2.fillRect(-w*.45,-h*.47,w*.3,h*.08);x2.fillRect(w*.15,-h*.47,w*.3,h*.08);x2.fillRect(-w*.15,-h*.44,w*.3,h*.025);
if(o.glow||o.brake){for(const q of[-1,1]){const gr=x2.createRadialGradient(q*w*.3,-h*.43,0,q*w*.3,-h*.43,w*.2);gr.addColorStop(0,'rgba(255,40,70,.55)');gr.addColorStop(1,'rgba(255,0,40,0)');x2.fillStyle=gr;x2.fillRect(q*w*.3-w*.2,-h*.43-w*.2,w*.4,w*.4)}}
x2.fillStyle=L(-h*.3,-h*.08,'#262633','#07070c');x2.fillRect(-w*.34,-h*.3,w*.68,h*.22);x2.fillStyle='#e9e9f5';x2.fillRect(-w*.07,-h*.36,w*.14,h*.05);if(o.neo){x2.fillStyle=o.neo;x2.fillRect(-w*.4,-h*.09,w*.8,h*.03)}
x2.strokeStyle='#000';x2.lineWidth=1;for(let i=-2;i<=2;i+=2){x2.beginPath();x2.moveTo(i*w*.07,-h*.28);x2.lineTo(i*w*.07,-h*.1);x2.stroke()}
const ex=[[-.2,.2],[-.2,.2],[-.26,-.13,.13,.26],[-.32,.32]][o.exh||0],er=w*(o.exh===1?.056:o.exh>1?.04:.045);x2.fillStyle='#8a8a99';x2.beginPath();for(const q of ex){x2.moveTo(q*w+er,-h*.12);x2.arc(q*w,-h*.12,er,0,7)}x2.fill();x2.fillStyle='#000';x2.beginPath();for(const q of ex){x2.moveTo(q*w+er*.5,-h*.12);x2.arc(q*w,-h*.12,er*.5,0,7)}x2.fill();
if(o.fire){for(const q of[-1,1]){const r=w*(.09+Math.random()*.06)*(o.ef||1),gr=x2.createRadialGradient(q*w*.2,-h*.12,0,q*w*.2,-h*.12,r*2.2);gr.addColorStop(0,'#fff');gr.addColorStop(.4,'#38d9ff');gr.addColorStop(1,'rgba(56,120,255,0)');x2.fillStyle=gr;x2.beginPath();x2.arc(q*w*.2,-h*.12,r*2.2,0,7);x2.fill()}}
if(dm>.2){x2.strokeStyle=`rgba(0,0,0,${.4+dm*.4})`;x2.lineWidth=Math.max(1,w*.012);x2.beginPath();x2.moveTo(-w*.3,-h*.58);x2.lineTo(-w*.12,-h*.4);x2.lineTo(-w*.2,-h*.3);x2.moveTo(w*.28,-h*.6);x2.lineTo(w*.1,-h*.45);x2.stroke();x2.fillStyle=`rgba(0,0,0,${dm*.45})`;x2.fillRect(-w*.47,-h*.5,w*.3,h*.18)}

if(dm>.8){for(let i=0;i<4;i++){const gr=x2.createRadialGradient((Math.random()-.5)*w*.4,-h*.8,0,0,-h*.8,w*.1);x2.fillStyle=i%2?'rgba(255,170,30,.8)':'rgba(255,90,20,.7)';x2.beginPath();x2.arc((Math.random()-.5)*w*.4,-h*(.8+Math.random()*.3),w*(.04+Math.random()*.05),0,7);x2.fill()}}

const $=id=>document.getElementById(id);

const sels={};OPT.forEach(([k,l,arr])=>{const lb=document.createElement('label');lb.textContent=l;const e=document.createElement('select');e.onchange=()=>{const c=cf(sel),v=+e.value,it=arr[v];if(it.p&&!sv.own[k+v]){if(sv.coins<it.p){toast('NOT ENOUGH COINS');e.value=c[k];return}sv.coins-=it.p;sv.own[k+v]=1}c[k]=v;save();refresh()};lb.appendChild(e);$('opts').appendChild(lb);sels[k]=e});

for(const[key,l,arr]of OPT){const e=sels[key];e.innerHTML=arr.map((it,i)=>`<option value=${i}>${it.n}${it.p?(sv.own[key+i]?' ✓':' — 🪙'+it.p):''}</option>`).join('');e.value=c[key]}
$('bars').innerHTML=[['SPEED',t.top/1.3],['ACCEL',t.acc/1.6],['HANDLING',t.hd/1.5],['GRIP',t.grip/1.3]].map(([n,v])=>`<div class=bar><span>${n}</span><i style="width:${Math.min(60,v*60)}%"></i></div>`).join('');

function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;sky=g.createLinearGradient(0,0,0,H*.52);sky.addColorStop(0,'#0e0426');sky.addColorStop(.5,'#7a1d6b');sky.addColorStop(.85,'#ff6a2e');sky.addColorStop(1,'#ffc04a');
city=[];let r=7;const R=()=>(r=(r*16807)%2147483647)/2147483647;for(let x=0;x<W*2;){const w=30+R()*70,h=30+R()*H*.22;const wn=[];for(let j=0;j<14;j++)wn.push([R()*(w-8),R()*h,R()>.5]);city.push({x,w,h,wn});x+=w-6}}

// track
const SL=200,RW=2200,CH=1100,D=.84,DRAW=130,MAX=12000,LAPS=3;let seg=[],lastY=0;

function road(e,h,l,c,dy){const sy=lastY,ey=sy+dy*SL,t=e+h+l;let n=0;for(let i=0;i<e;i++)add(ei(0,c,i/e),eio(sy,ey,n++/t));for(let i=0;i<h;i++)add(c,eio(sy,ey,n++/t));for(let i=0;i<l;i++)add(eo(c,0,i/l),eio(sy,ey,n++/t))}

const N=seg.length,len=N*SL;
// state
